<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>test2-claude-class</title>
  <style>
    :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --accent: #c96442; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b1b19; --fg: #ececea; --muted: #a3a39d; --accent: #e08a6a; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      padding: 16px;
    }
    main { max-width: 560px; text-align: center; }
    h1 { font-size: 2rem; margin: 0 0 12px; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 8px; }
    .dot { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>test2-claude-class<span class="dot">.</span></h1>
    <p>안녕하세요! Claude 수업 실습용 페이지입니다.</p>
    <p>Hello! This is a practice page for the Claude class.</p>
  </main>
</body>
</html>
